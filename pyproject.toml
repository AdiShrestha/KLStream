[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "klstream"
version = "0.2.0.dev0"
description = "KLStream: Low-Latency Parallel Stream Processing Runtime in C++17"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
authors = [
    { name = "KLStream Authors" }
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0"
]
